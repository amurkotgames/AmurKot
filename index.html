<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmurKot MUSIC — Multi-Source Streaming</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0b0e;
            --bg-surface: #12141a;
            --bg-card: #181a22;
            --bg-card-hover: #222634;
            --accent: #ff4757;
            --accent-glow: rgba(255, 71, 87, 0.35);
            --text-main: #f1f2f6;
            --text-muted: #878e99;
            --spotify-color: #1DB954;
            --yandex-color: #ffcc00;
            --vk-color: #0077FF;
            --player-height: 90px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* Сайдбар */
        aside {
            width: 260px;
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .logo {
            padding: 24px;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
        }

        .logo i {
            color: var(--accent);
            font-size: 1.6rem;
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        .nav-list {
            list-style: none;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            border-left: 3px solid var(--accent);
            border-radius: 0 8px 8px 0;
        }

        .nav-section-title {
            padding: 24px 20px 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .source-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        /* Главный контент */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: calc(100vh - var(--player-height));
            overflow-y: auto;
            position: relative;
            background: linear-gradient(180deg, #181926 0%, var(--bg-base) 300px);
        }

        header {
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(10, 11, 14, 0.8);
            backdrop-filter: blur(20px);
            z-index: 5;
        }

        .search-box {
            position: relative;
            width: 380px;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px 12px 42px;
            border-radius: 20px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-tags {
            display: flex;
            gap: 10px;
            padding: 0 32px 20px;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .filter-btn:hover {
            color: #fff;
            background: var(--bg-card-hover);
        }

        .filter-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .content-section {
            padding: 0 32px 32px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* Сетка треков */
        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .track-card {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .track-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-5px);
        }

        .cover-wrap {
            position: relative;
            width: 100%;
            padding-top: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .cover-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .source-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .badge-spotify { background: #000; color: var(--spotify-color); }
        .badge-yandex { background: #000; color: var(--yandex-color); }
        .badge-vk { background: #fff; color: var(--vk-color); }

        .card-play-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            opacity: 0;
            transform: translateY(10px);
            transition: 0.3s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .track-card:hover .card-play-btn {
            opacity: 1;
            transform: translateY(0);
        }

        .track-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Нижний плеер */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--player-height);
            background: rgba(18, 20, 26, 0.95);
            backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 25%;
        }

        .now-cover {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            object-fit: cover;
        }

        .now-info h4 {
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .now-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 50%;
        }

        .btn-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-controls button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .btn-controls button:hover {
            color: #fff;
        }

        .btn-controls .play-main {
            width: 40px;
            height: 40px;
            background: #fff;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-controls .play-main:hover {
            transform: scale(1.08);
            color: #000;
        }

        .progress-bar-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
        }

        .extra-controls {
            width: 25%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 120px;
        }

        .volume-slider {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Сайдбар -->
    <aside>
        <div class="logo">
            <i class="fa-solid fa-cat"></i>
            <span>AmurKot MUSIC</span>
        </div>
        
        <ul class="nav-list">
            <li class="nav-item active"><i class="fa-solid fa-house"></i> Главная</li>
            <li class="nav-item"><i class="fa-solid fa-compass"></i> Обзор</li>
            <li class="nav-item"><i class="fa-solid fa-heart"></i> Избранное</li>
        </ul>

        <div class="nav-section-title">Источники Музыки</div>
        <ul class="nav-list">
            <li class="nav-item source-pill" onclick="filterBySource('all')">
                <i class="fa-solid fa-layer-group"></i> Все потоки
            </li>
            <li class="nav-item source-pill" onclick="filterBySource('yandex')">
                <i class="fa-brands fa-yandex" style="color: var(--yandex-color)"></i> Яндекс Музыка
            </li>
            <li class="nav-item source-pill" onclick="filterBySource('vk')">
                <i class="fa-brands fa-vk" style="color: var(--vk-color)"></i> VK Музыка
            </li>
            <li class="nav-item source-pill" onclick="filterBySource('spotify')">
                <i class="fa-brands fa-spotify" style="color: var(--spotify-color)"></i> Spotify Hub
            </li>
        </ul>
    </aside>

    <!-- Основной контент -->
    <main>
        <header>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Поиск по всем платформам...">
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <i class="fa-regular fa-bell" style="cursor: pointer; color: var(--text-muted);"></i>
                <div style="width: 36px; height: 36px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold;">AK</div>
            </div>
        </header>

        <div class="filter-tags">
            <button class="filter-btn active" onclick="applyTag(this, 'all')">Все</button>
            <button class="filter-btn" onclick="applyTag(this, 'spotify')"><i class="fa-brands fa-spotify" style="color: var(--spotify-color)"></i> Spotify</button>
            <button class="filter-btn" onclick="applyTag(this, 'yandex')"><i class="fa-brands fa-yandex" style="color: var(--yandex-color)"></i> Яндекс</button>
            <button class="filter-btn" onclick="applyTag(this, 'vk')"><i class="fa-brands fa-vk" style="color: var(--vk-color)"></i> VK</button>
        </div>

        <section class="content-section">
            <h2 class="section-title">Рекомендации кросс-потока</h2>
            <div class="tracks-grid" id="tracksGrid">
                <!-- Карточки генерируются скриптом -->
            </div>
        </section>
    </main>

    <!-- Аудиоплеер -->
    <div class="bottom-player">
        <div class="now-playing">
            <img src="" id="currentCover" class="now-cover" alt="Cover" style="display: none;">
            <div class="now-info">
                <h4 id="currentTitle">Выберите трек</h4>
                <p id="currentArtist">AmurKot Stream Engine</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="btn-controls">
                <button onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="play-main" onclick="togglePlay()"><i class="fa-solid fa-play" id="playIcon"></i></button>
                <button onclick="nextTrack()"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-bar-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar" onclick="seekTrack(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <i class="fa-solid fa-volume-high" style="color: var(--text-muted);"></i>
            <div class="volume-box">
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.7" oninput="changeVolume(this.value)">
            </div>
        </div>
    </div>

    <!-- Аудио элемент HTML5 -->
    <audio id="audioEngine"></audio>

    <script>
        // Демонстрационная база данных с указанием источника трека
        // В реальном проекте здесь работает NodeJS/Python парсер или API-мост
        const trackList = [
            {
                id: 1,
                title: "Cyber City Ambient",
                artist: "SynthWave Collective",
                source: "spotify",
                cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&q=80",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
            },
            {
                id: 2,
                title: "Ночной проспект",
                artist: "MiyaGi & Эндшпиль style",
                source: "vk",
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&q=80",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
            },
            {
                id: 3,
                title: "Танец на стеклах",
                artist: "Русский Хит",
                source: "yandex",
                cover: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=400&q=80",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            },
            {
                id: 4,
                title: "Tokyo Drift Vibe",
                artist: "Phonk Maestro",
                source: "spotify",
                cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=400&q=80",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"
            },
            {
                id: 5,
                title: "План Б",
                artist: "VK Underground",
                source: "vk",
                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&q=80",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3"
            },
            {
                id: 6,
                title: "Моя Любовь",
                artist: "Яндекс Топ 100",
                source: "yandex",
                cover: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&q=80",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3"
            }
        ];

        let currentTrackIdx = 0;
        let isPlaying = false;
        const audio = document.getElementById("audioEngine");
        const tracksGrid = document.getElementById("tracksGrid");

        // Отрисовка списка треков
        function renderTracks(tracks) {
            tracksGrid.innerHTML = '';
            tracks.forEach((track, index) => {
                let badgeClass = '', badgeIcon = '';
                if(track.source === 'spotify') { badgeClass = 'badge-spotify'; badgeIcon = 'fa-brands fa-spotify'; }
                if(track.source === 'yandex') { badgeClass = 'badge-yandex'; badgeIcon = 'fa-brands fa-yandex'; }
                if(track.source === 'vk') { badgeClass = 'badge-vk'; badgeIcon = 'fa-brands fa-vk'; }

                const card = document.createElement('div');
                card.className = 'track-card';
                card.onclick = () => playSelectedTrack(trackList.findIndex(t => t.id === track.id));
                card.innerHTML = `
                    <div class="cover-wrap">
                        <img src="${track.cover}" alt="${track.title}">
                        <div class="source-badge ${badgeClass}"><i class="${badgeIcon}"></i></div>
                        <div class="card-play-btn"><i class="fa-solid fa-play"></i></div>
                    </div>
                    <div class="track-title">${track.title}</div>
                    <div class="track-artist">${track.artist}</div>
                `;
                tracksGrid.appendChild(card);
            });
        }

        // Фильтры источников
        function filterBySource(source) {
            if (source === 'all') {
                renderTracks(trackList);
            } else {
                const filtered = trackList.filter(t => t.source === source);
                renderTracks(filtered);
            }
        }

        function applyTag(button, source) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            filterBySource(source);
        }

        // Управление плеером
        function playSelectedTrack(idx) {
            currentTrackIdx = idx;
            loadTrack(trackList[currentTrackIdx]);
            audio.play();
            isPlaying = true;
            updatePlayBtn();
        }

        function loadTrack(track) {
            audio.src = track.url;
            document.getElementById('currentTitle').innerText = track.title;
            document.getElementById('currentArtist').innerText = track.artist + ` • [Источник: ${track.source.toUpperCase()}]`;
            const cover = document.getElementById('currentCover');
            cover.src = track.cover;
            cover.style.display = 'block';
        }

        function togglePlay() {
            if (!audio.src) {
                playSelectedTrack(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
            } else {
                audio.play();
            }
            isPlaying = !isPlaying;
            updatePlayBtn();
        }

        function updatePlayBtn() {
            const icon = document.getElementById('playIcon');
            icon.className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        }

        function nextTrack() {
            currentTrackIdx = (currentTrackIdx + 1) % trackList.length;
            playSelectedTrack(currentTrackIdx);
        }

        function prevTrack() {
            currentTrackIdx = (currentTrackIdx - 1 + trackList.length) % trackList.length;
            playSelectedTrack(currentTrackIdx);
        }

        // Синхронизация полосы прогресса
        audio.addEventListener('timeupdate', () => {
            const current = audio.currentTime;
            const duration = audio.duration || 0;
            const progressPercent = (current / duration) * 100;
            document.getElementById('progressFill').style.width = `${progressPercent}%`;
            
            document.getElementById('currentTime').innerText = formatTime(current);
            document.getElementById('totalDuration').innerText = formatTime(duration);
        });

        audio.addEventListener('ended', nextTrack);

        function seekTrack(e) {
            const bar = document.getElementById('progressBar');
            const clickPosition = (e.clientX - bar.getBoundingClientRect().left) / bar.offsetWidth;
            audio.currentTime = clickPosition * audio.duration;
        }

        function changeVolume(val) {
            audio.volume = val;
        }

        function formatTime(sec) {
            let minutes = Math.floor(sec / 60);
            let seconds = Math.floor(sec % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        // Поиск в реальном времени
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = trackList.filter(t => 
                t.title.toLowerCase().includes(query) || 
                t.artist.toLowerCase().includes(query)
            );
            renderTracks(filtered);
        });

        // Инициализация при загрузке
        renderTracks(trackList);
    </script>
</body>
</html>
