<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmurKot MUSIC</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-base: #08090c;
            --bg-surface: #101218;
            --bg-card: #181a24;
            --bg-card-hover: #222634;
            --accent: #ff4757;
            --accent-glow: rgba(255, 71, 87, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #7d8590;
            --spotify: #1DB954;
            --yandex: #ffcc00;
            --vk: #0077FF;
            --player-height: 90px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        aside {
            width: 250px;
            background: var(--bg-surface);
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 24px;
        }

        .logo { font-size: 1.3rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--accent); font-size: 1.5rem; text-shadow: 0 0 10px var(--accent-glow); }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active { border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; }

        main { flex: 1; display: flex; flex-direction: column; height: calc(100vh - var(--player-height)); overflow-y: auto; }

        header {
            padding: 20px 32px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            background: rgba(8, 9, 12, 0.85);
            backdrop-filter: blur(15px);
            z-index: 10;
        }

        .search-box { position: relative; width: 420px; }
        .search-box input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px 12px 42px;
            border-radius: 25px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .grid-container {
            padding: 0 32px 32px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .track-card {
            background: var(--bg-card);
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
        }
        .track-card:hover { transform: translateY(-4px); background: var(--bg-card-hover); }

        .cover-box { position: relative; width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
        .cover-box img { width: 100%; height: 100%; object-fit: cover; }

        .source-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .source-spotify { background: var(--spotify); color: #000; }
        .source-yandex { background: var(--yandex); color: #000; }
        .source-vk { background: var(--vk); color: #fff; }

        .track-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Нижний плеер */
        .player {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: var(--player-height);
            background: var(--bg-surface);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 100;
        }

        .player-left { display: flex; align-items: center; gap: 14px; width: 25%; }
        .player-cover { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; }
        .player-info h4 { font-size: 0.9rem; margin-bottom: 3px; }
        .player-info p { font-size: 0.75rem; color: var(--text-muted); }

        .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 50%; }
        .controls { display: flex; align-items: center; gap: 18px; }
        .btn-ctrl { background: none; border: none; color: #fff; cursor: pointer; font-size: 1.1rem; }
        .btn-play {
            width: 38px; height: 38px; background: #fff; color: #000; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }
        
        .progress-line-box { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.75rem; color: var(--text-muted); }
        .bar-bg { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; position: relative; }
        .bar-fill { position: absolute; height: 100%; width: 0%; background: var(--accent); border-radius: 2px; }

        .player-right { width: 25%; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
        .volume-slider { width: 100px; -webkit-appearance: none; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: #fff; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <aside>
        <div class="logo">
            <i class="fa-solid fa-cat"></i>
            <span>AmurKot</span>
        </div>
        <div class="nav-item active"><i class="fa-solid fa-house"></i> Главная</div>
        <div class="nav-item"><i class="fa-solid fa-radio"></i> Потоки</div>
        <div class="nav-item"><i class="fa-solid fa-heart"></i> Избранное</div>
    </aside>

    <main>
        <header>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Поиск по Spotify, VK и Яндекс Музыке...">
            </div>
            <div id="statusIndicator" style="font-size: 0.8rem; color: var(--text-muted);">
                <i class="fa-solid fa-circle-nodes" style="color: var(--accent);"></i> Сервер: https://amurkot.freedev.app
            </div>
        </header>

        <h2 style="padding: 20px 32px 10px; font-size: 1.2rem;">Поисковая выдача</h2>
        <div class="grid-container" id="tracksGrid">
            <!-- Треки подгружаются динамически -->
        </div>
    </main>

    <!-- Нижняя панель плеера -->
    <div class="player">
        <div class="player-left">
            <img id="trackCover" class="player-cover" src="https://via.placeholder.com/50" alt="">
            <div class="player-info">
                <h4 id="trackTitle">AmurKot MUSIC</h4>
                <p id="trackArtist">Ожидание выбора трека</p>
            </div>
        </div>

        <div class="player-center">
            <div class="controls">
                <button class="btn-ctrl" onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="btn-ctrl btn-play" onclick="togglePlay()"><i class="fa-solid fa-play" id="playIcon"></i></button>
                <button class="btn-ctrl" onclick="nextTrack()"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-line-box">
                <span id="currentTime">0:00</span>
                <div class="bar-bg" id="progressBar" onclick="seek(event)">
                    <div class="bar-fill" id="barFill"></div>
                </div>
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <i class="fa-solid fa-volume-high" style="color: var(--text-muted); font-size: 0.85rem;"></i>
            <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0.7" oninput="setVolume(this.value)">
        </div>
    </div>

    <audio id="audioStream"></audio>

    <script>
        // Ссылка на ваш рабочий PHP-сервер
        const SERVER_URL = 'https://amurkot.freedev.app/MUSICServer.php';

        const audio = document.getElementById('audioStream');
        let tracks = [];
        let currentIdx = -1;
        let searchDebounce;

        // Автопоиск при вводе
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchDebounce);
            const val = e.target.value.trim();
            if (!val) return;

            searchDebounce = setTimeout(() => {
                fetchTracks(val);
            }, 500);
        });

        async function fetchTracks(query) {
            try {
                const res = await fetch(`${SERVER_URL}?action=search&q=${encodeURIComponent(query)}`);
                tracks = await res.json();
                renderTracks(tracks);
            } catch (err) {
                console.error("Ошибка связи с сервером AmurKot:", err);
            }
        }

        function renderTracks(data) {
            const grid = document.getElementById('tracksGrid');
            grid.innerHTML = '';

            data.forEach((t, index) => {
                const card = document.createElement('div');
                card.className = 'track-card';
                card.onclick = () => playByIndex(index);
                card.innerHTML = `
                    <div class="cover-box">
                        <img src="${t.cover}" alt="">
                        <span class="source-tag source-${t.source}">${t.source}</span>
                    </div>
                    <div class="track-title">${t.title}</div>
                    <div class="track-artist">${t.artist}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playByIndex(idx) {
            currentIdx = idx;
            const t = tracks[idx];
            
            document.getElementById('trackTitle').innerText = t.title;
            document.getElementById('trackArtist').innerText = `${t.artist} [${t.source.toUpperCase()}]`;
            document.getElementById('trackCover').src = t.cover;

            audio.src = t.stream;
            audio.play();
            updatePlayBtn(true);
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                updatePlayBtn(true);
            } else {
                audio.pause();
                updatePlayBtn(false);
            }
        }

        function updatePlayBtn(playing) {
            document.getElementById('playIcon').className = playing ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        }

        function prevTrack() {
            if (currentIdx > 0) playByIndex(currentIdx - 1);
        }

        function nextTrack() {
            if (currentIdx < tracks.length - 1) playByIndex(currentIdx + 1);
        }

        // Синхронизация времени
        audio.addEventListener('timeupdate', () => {
            const cur = audio.currentTime;
            const dur = audio.duration || 0;
            document.getElementById('barFill').style.width = `${(cur / dur) * 100}%`;
            document.getElementById('currentTime').innerText = formatTime(cur);
            document.getElementById('totalTime').innerText = formatTime(dur);
        });

        audio.addEventListener('ended', nextTrack);

        function seek(e) {
            const bar = document.getElementById('progressBar');
            const pos = (e.clientX - bar.getBoundingClientRect().left) / bar.offsetWidth;
            audio.currentTime = pos * audio.duration;
        }

        function setVolume(val) { audio.volume = val; }

        function formatTime(sec) {
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Стартовый поиск при загрузке
        fetchTracks('Phonk');
    </script>
</body>
</html>
